<!DOCTYPE html>
<html>

<head>
    <title>Signup</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <h1>Signup</h1><br><br>
    <input
        id="username"
        placeholder="Username"
    >
    <br><br>
    <input
        id="password"
        type="password"
        placeholder="Password"
    >
    <br><br>
    <select id="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
    </select>
    <br><br>
    <button id="btn" >
        Signup
    </button>
    <p1 onclick="window.location.href='login.html'">Already have an account? Login</p1>

    <script src="signup.js"></script>

</body>

</html>
